<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>PokeAPI</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <style>
            body{
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: white;
            }

            .bg-login-image{
                background-image: url('https://i.pinimg.com/736x/06/5e/5e/065e5e9239f7d492dc3d64e57e84d6ed.jpg');
                background-size: cover;
                background-position: center;
                position: relative;
            }

            .bg-overlay{
                position: absoulte;
                top: 0;
                left: 0;
                widows: 100%;
                height: 100%;
                background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
            }

            .hero-text{
                position: absolute;
                bottom: 40px;
                left: 40px;
                color: white;
                z-index: 2;
            }

            .login-section{
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 40px;
            }

            .login-container{
                widows: 100%;
                max-width: 450px;
            }

            .btn-login{
                background-color: #ff3e3e;
                border: none;
                font-weight: 600;
                padding: 12px;
                transition: all 0.3s;
            }

            .btn-login:hover {
                background-color: #d63030;
                trasnfomr: trasnlateY(-2px);
            }

            .logo-icon{
                font-size: 3rem;
                color: #ff3e3e;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid p-0">
            <div class="row g-0">
                <div class="col-lg-7 d-none d-lg-block bg-login-image vh-100">
                    <div class="bg-overlay"></div>
                    <div class="hero-text">
                        <h1 class="fw-bold display-5">Atrápalos a todos</h1>
                        <p class="fs-4">Pokémon</p>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="login-section">
                        <div class="login-container">
                            <div class="text-center mb-5">
                                <i class="bi bi-vinyl-fill logo-icon"></i>
                                <h2 class="fw-bold mt-3">¡Hola de nuevo</h2>
                                <p class="text-muted">Ingresa tus credenciales para a la app</p>
                            </div>

                            <div th:if="${error}" class='card bg-danger w-50 my-3 mx-auto'>
                                <p class="text-center fs-5 text-light">Error al iniciar sesión</p>
                            </div>

                            <form th:action="@{login}" method="POST" >
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" name="email" id="floatingInput" placeholder="name@example.com">
                                    <label for="floatingInput">Correo Electrónico</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="password" name="password" class="form-control" id="floatingPassword">
                                    <label for="floatingPassword">contraseña</label>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <a href="#" class="text-decoration-none small fw-bold text-primary" data-bs-toggle="modal" data-bs-target="#modalRecuperar">¿Olvidaste tu contraseña?</a>
                                </div>
                                <div class="d-grid mb-4">
                                    <button type="submit" class="btn btn-primary btn-login btn-lg text-white rounded-pill shadow">
                                        Iniciar Sesión
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Recuperar contraseña</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" id="emailRecuperacion" class="form-control"
                                   placeholder="correo@ejemplo.com">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-primary" onclick="enviarCorreoRecuperacion()">
                            Enviar correo
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script th:if="${success}" th:inline="javascript">
            Swal.fire({
            icon: [[${icon}]],
                    title: [[${$success}]],
            });
        </script>
        <script>
            function enviarCorreoRecuperacion() {
                const email = $("#emailRecuperacion").val().trim();

                if (email === "") {
                    Swal.fire("Error", "Ingresa un correo", "warning");
                    return;
                }

                let formData = new FormData();
                formData.append("email", email);

                $.ajax({
                    url: "http://localhost:8080/api/usuario/sendEmailRecuperacionPass",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (resp) {
                        Swal.fire("Éxito", resp.object, "success");
                        $("#modalRecuperar").modal("hide");
                        $("#emailRecuperacion").val("");
                    },
                    error: function (xhr) {
                        let mensaje = "Ocurrió un error";
                        if (xhr.responseJSON?.object) {
                            mensaje = xhr.responseJSON.object;
                        }
                        Swal.fire("Error", mensaje, "error");
                    }
                });
            }
        </script>
    </body>
</html>
