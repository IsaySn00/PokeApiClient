<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <style>
            body{
                background-color: #f4f4f7;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .card-password{
                border: none;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            }

            .card-header-custom{
                background-color: #ff3e3e;
                padding: 30px 20px;
                text-align: center;
                color: white;
            }

            .icon-bg{
                width: 70px;
                height: 70px;
                background-color: rgba(255,255,255,0.2);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 15px;
                font-size: 2rem;
            }

            .btn-password{
                background-color: #ff3e3e;
                border: none;
                padding: 12px;
                font-weight: 600;
                border-radius: 50px;
                transition: all 0.3s;
            }

            .btn-password:hover{
                background-color: #d63030;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(214, 48, 48, 0.3);
            }

            .password-group{
                position: relative;
            }

            .toggle-password{
                position: absolute;
                top: 50%;
                right: 15px;
                transform: translateY(-50%);
                cursor: pointer;
                color: #aaa;
                z-index: 10;
            }

            .form-floating > .form-control{
                padding-right: 45px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">

                    <div class="card card-password">
                        <div class="card-header-custom">
                            <div class="icon-bg">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h4 class="fw-bold m-0">Seguridad</h4>
                            <small class="opacity-75">Restablece tu acceso</small>
                        </div>

                        <div class="card-body p-4 pt-5">

                            <div class="mb-4">
                                <div class="form-floating password-group">
                                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Nueva contraseña" required>
                                    <label for="newPassword">Nueva Contraseña</label>
                                    <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
                                </div>
                                <div class="form-text mt-2 text-muted small">
                                    <i class="bi bi-info-circle me-1"></i> Usa al menos 8 caracteres para mayor seguridad.
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-password shadow">
                                    Actualizar Contraseña
                                </button>
                                <a th:href="@{/login}" class="btn btn-link text-secondary text-decoration-none small">
                                    Cancelar y volver al login
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            const togglePassword = document.querySelector("#togglePassword");
            const password = document.querySelector("#newPassword");

            togglePassword.addEventListener('click', function (e) {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);

                this.classList.toggle("bi-eye");
                this.classList.toggle("bi-eye-slash");
            });

            $(document).ready(function () {
                var token = getUrlParameter('token');

                if (token) {
                    sessionStorage.setItem('tkn', token);
                }
            })

            $('.btn-password').on("click", function (e) {
                e.preventDefault();

                const passwordVal = $("#newPassword").val();

                if (!passwordVal) {
                    Swal.fire("Atención", "Por favor escribe una contraseña", "warning");
                    return;
                }

                let formData = new FormData();
                formData.append("password", passwordVal);

                let btn = $(this);
                btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Procesando...');

                $.ajax({
                    type: 'POST',
                    url: 'http://localhost:8080/api/usuario/recuperarPassword',
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {"Authorization": "Bearer " + sessionStorage.getItem('tkn')},
                    success: function (data, textStatus, jqXHR) {
                        Swal.fire({
                            title: "¡Éxito!",
                            text: "Contraseña recuperada correctamente",
                            icon: "success",
                            confirmButtonColor: "#ff3e3e"
                        });
                        setTimeout(function () {
                            window.location.href = "http://localhost:8081/usuario/login";
                        }, 3000);
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        btn.prop('disabled', false).text('Actualizar Contraseña'); // Reactivar botón
                        Swal.fire({
                            title: "Error",
                            text: "No se pudo actualizar. El enlace puede haber expirado.",
                            icon: "error",
                            confirmButtonColor: "#2c3e50"
                        });
                        setTimeout(function () {
                            window.location.href = "http://localhost:8081/usuario/login";
                        }, 3000);
                    }
                })
            })


            function getUrlParameter(name) {
                name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
                var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
                var results = regex.exec(location.search);
                return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
            }
        </script>
    </body>
</html>
