<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <div class="container" layout:fragment="contenido">
        <style>
            .btn-fav {
                border: 2px solid #e0e0e0;
                background: white;
                color: #ccc;
                width: 50px;
                height: 50px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                cursor: pointer;
                transition: all 0.3s;
            }
            .btn-fav:hover, .btn-fav.active {
                border-color: #ff4757;
                color: #ff4757;
            }
            .btn-fav.active {
                background-color: #ff4757;
                color: white;
            }

            .info-panel {
                background: white;
                border-radius: 20px;
                padding: 25px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.03);
                margin-bottom: 20px;
                border: 1px solid rgba(0,0,0,0.02);
                h-100;
            }
            .panel-title {
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #999;
                font-weight: 700;
                margin-bottom: 15px;
            }

            .card-identity {
                background: linear-gradient(145deg, #ffffff, #f0f0f0);
                border-radius: 24px;
                text-align: center;
                position: relative;
                overflow: hidden;
                height: 100%;
                box-shadow: 0 10px 30px rgba(0,0,0,0.08);
                padding: 2rem;
            }
            .bg-circle {
                position: absolute;
                top: -60px;
                left: 50%;
                transform: translateX(-50%);
                width: 320px;
                height: 320px;
                background-color: var(--primary-color);
                opacity: 0.15;
                border-radius: 50%;
                z-index: 0;
            }
            .pokemon-img {
                width: 240px;
                height: 240px;
                object-fit: contain;
                z-index: 1;
                position: relative;
                filter: drop-shadow(0 15px 20px rgba(0,0,0,0.15));
                transition: transform 0.3s;
            }
            .card-identity:hover .pokemon-img {
                transform: scale(1.05) rotate(3deg);
            }

            .ability-badge {
                display: inline-flex;
                align-items: center;
                padding: 8px 16px;
                border-radius: 50px;
                font-weight: 600;
                font-size: 0.9rem;
                margin-right: 8px;
                margin-bottom: 8px;
            }
            .ability-normal {
                background-color: #f1f2f6;
                color: #2f3542;
                border: 1px solid #dfe4ea;
            }
            .ability-hidden {
                background-color: #fff7d6;
                color: #d35400;
                border: 1px solid #ffeaa7;
            }

            .stat-item {
                display: flex;
                align-items: center;
                margin-bottom: 12px;
            }
            .stat-label {
                width: 45px;
                font-weight: 600;
                color: #555;
                font-size: 0.85rem;
            }
            .progress-custom {
                height: 8px;
                border-radius: 6px;
                background-color: #eee;
                flex-grow: 1;
                margin: 0 15px;
            }
            .progress-bar-custom {
                border-radius: 6px;
                background: linear-gradient(90deg, var(--primary-color), #f1c40f);
            }

            .type-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 10px;
            }
            .type-badge {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 10px;
                border-radius: 12px;
                background: #f8f9fa;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .type-icon {
                width: 25px;
                height: 25px;
                border-radius: 50%;
                margin-bottom: 5px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
            }
            .t-ground {
                background-color: #E2BF65;
            }
            .t-flying {
                background-color: #A98FF3;
            }
            .t-steel {
                background-color: #B7B7CE;
            }
            .t-electric {
                background-color: #F8D030;
            }

            .evo-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 20px;
                flex-wrap: wrap;
            }
            .evo-card {
                text-align: center;
                position: relative;
                transition: transform 0.2s;
            }
            .evo-card:hover {
                transform: translateY(-5px);
            }

            .evo-img-wrapper {
                width: 100px;
                height: 100px;
                background: #f8f9fa;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 10px;
                border: 2px solid transparent;
            }

            .current-evo .evo-img-wrapper {
                border-color: var(--primary-color);
                background: #fffcf0;
                box-shadow: 0 0 15px rgba(248, 208, 48, 0.3);
            }

            .evo-img {
                width: 70px;
                height: 70px;
                object-fit: contain;
            }
            .evo-arrow {
                color: #ccc;
                font-size: 1.5rem;
            }
        </style>

        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <!--                <span class="text-muted h5">#025</span>-->
                <input type="hidden" th:value="${pokemon.id}" class="idPoke"/>
                <h1 class="display-4 fw-bold mb-0" th:text="${pokemon.name}"></h1>
                <div class="mt-2"><span class="badge rounded-pill text-bg-warning text-white px-3 py-2"></span></div>
            </div>
            <button class="btn-fav" id="btnFav" onclick="this.classList.toggle('active')"><i class="bi bi-heart-fill"></i></button>
        </div>

        <div class="row g-4">

            <div class="col-lg-4">
                <div class="card-identity d-flex flex-column justify-content-center align-items-center">
                    <div class="bg-circle"></div>
                    <img th:src="${pokemon.sprites.front_default}" alt="poke" class="pokemon-img">

                    <div class="row w-100 mt-4 text-center">
                        <div class="col-6 border-end">
                            <small class="text-muted text-uppercase">Altura</small>
                            <h4 class="fw-bold" h:text="${pokemon.height}"></h4>
                        </div>
                        <div class="col-6">
                            <small class="text-muted text-uppercase">Peso</small>
                            <h4 class="fw-bold" th:text="${pokemon.weight}"></h4>
                        </div>
                    </div>
                    <p class="text-muted mt-4 text-center fst-italic px-3">Descc</p>
                </div>
            </div>

            <div class="col-lg-8">

                <div class="info-panel mb-3">
                    <h6 class="panel-title"><i class="bi bi-stars me-2"></i> Habilidades</h6>
                    <div class="d-flex flex-wrap">
                        <div class="ability-badge ability-normal">

                        </div>
                        <div class="ability-badge ability-hidden" title="Habilidad Oculta">
                            <i class="bi bi-eye-slash-fill me-2"></i> 
                        </div>
                    </div>
                </div>

                <div class="info-panel mb-3">
                    <h6 class="panel-title"><i class="bi bi-bar-chart-line-fill me-2"></i> Stats Base</h6>
                    <div class="stat-item">
                        <span class="stat-label">HP</span>
                        <div class="progress progress-custom"><div class="progress-bar progress-bar-custom" style="width: 35%"></div></div>
                        <span class="fw-bold"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">ATK</span>
                        <div class="progress progress-custom"><div class="progress-bar progress-bar-custom" style="width: 55%"></div></div>
                        <span class="fw-bold"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">DEF</span>
                        <div class="progress progress-custom"><div class="progress-bar progress-bar-custom" style="width: 40%"></div></div>
                        <span class="fw-bold"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">SPD</span>
                        <div class="progress progress-custom"><div class="progress-bar progress-bar-custom" style="width: 90%; background: #ff7675;"></div></div>
                        <span class="fw-bold"></span>
                    </div>
                </div>

                <div class="row g-3">

                    <div class="col-md-6">
                        <div class="info-panel h-100">
                            <h6 class="panel-title text-success"><i class="bi bi-shield-fill-check me-2"></i> Fortaleza</h6>
                            <div class="type-grid">
                                <div class="type-badge">
                                    <div class="type-icon t-flying"><i class="bi bi-wind"></i></div>
                                    <span>Volador</span>
                                </div>

                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-panel h-100">
                            <h6 class="panel-title text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i> Debilidad</h6>
                            <div class="type-grid">
                                <div class="type-badge">
                                    <div class="type-icon t-ground"><i class="bi bi-bricks"></i></div>
                                    <span>Tierra</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div> <div class="col-12">
                <div class="info-panel">
                    <h6 class="panel-title text-center mb-4">Línea Evolutiva</h6>

                    <div class="evo-container">

                        <div class="evo-card">
                            <div class="evo-img-wrapper">
                                <img src="" alt="ev" class="evo-img">
                            </div>
                            <small class="fw-bold text-muted"></small>
                        </div>

                        <i class="bi bi-chevron-right evo-arrow"></i>

                        <div class="evo-card current-evo">
                            <div class="evo-img-wrapper">
                                <img src="" alt="ev" class="evo-img">
                            </div>
                            <small class="fw-bold text-dark"></small>
                        </div>

                        <i class="bi bi-chevron-right evo-arrow"></i>

                        <div class="evo-card">
                            <div class="evo-img-wrapper">
                                <img src="" alt="ev" class="evo-img">
                            </div>
                            <small class="fw-bold text-muted"></small>
                        </div>

                    </div>
                </div>
            </div>
        </div> 
        <script th:inline="javascript">
            $(".btn-fav").on("click", function () {

                let id = /*[[${session.id}]]*/ '';
                let idPoke = $(".idPoke").val();
                const fav = {
                    idPokemon: idPoke
                }

                $.ajax({
                    type: 'POST',
                    url: `http://localhost:8080/api/favorito?idUsuario=${id}`,
                    headers: {"Authorization": "Bearer " + /*[[${session.tkn}]]*/ ''},
                    contentType: "application/json",
                    data: JSON.stringify(fav),
                    datatype: "json",
                    sucess: function (response) {
                        Swal.fire({
                            title: 'Pókemon añadido a lista de favoritos',
                            icon: 'success',
                            timer: 3000,
                            timerProgressBar: false,
                            showConfirmButton: false
                        })
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        Swal.fire({
                            title: "Error",
                            text: "Error al añadir a favoritos",
                            icon: "error"
                        });
                    }
                })
            });
        </script>
    </div> 
</html>
