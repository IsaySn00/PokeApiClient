<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <div class="container py-5" layout:fragment="contenido">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h2 class="fw-bold text-secondary">Usuarios</h2>
                <p class="text-muted">Explora la lista de Usuarios registrados</p>
            </div>
        </div>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">IdUsuario</th>
                    <th scope="col">Accion</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Rol</th>
                    <th scope="col">Contacto</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario: ${usuarios}">

                    <td id="idUsuario" th:text="${usuario.idUsuario}"></td>
                    <!--<td id="Imagen"><svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                        </svg></td>-->
                    <td>
                        <a th:href="@{usuario/{idUsuario}(idUsuario = ${usuario.idUsuario})}">
                            <button type="button" id="btnEditar" class="btn btn-warning" title="Editar Usuario" th:field="*{usuario.idUsuario}"><i class="bi bi-pencil-square"></i></button>
                        </a>
                        <button type="button" class="btn btn-danger btnEliminar"  title="Eliminar Usuario" th:data-id="${usuario.idUsuario}"><i class="bi bi-trash-fill"></i></button>  
                    </td>
                    <td th:utext="|${usuario.nombreUsuario} ${usuario.apellidoPatUsuario} ${usuario.apellidoMatUsuario} </br><br> ${usuario.userName}|"></td>
                    <td th:text="${usuario.Rol.nombreRol}"></td>
                    <td th:utext="|<i class='bi bi-telephone-fill'></i> ${usuario.telefonoUsuario} <br> <i class='bi bi-envelope-fill'></i> ${usuario.emailUsuario}|"> </td>
                </tr>
            </tbody>
        </table>
        
        
        <script>
        $(document).ready(function () {
                $(".btnEliminar").click(function (idUsuario) {
                    console.log(this);
                    var id = $(this).data("id");
                    console.log(id);
                    Swal.fire({
                        title: "¿Desea eliminar al usuario?",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: "#3085d6",
                        cancelButtonColor: "#d33",
                        confirmButtonText: "Si, eliminar"
                    }).then((result) => {
                        if (result.isConfirmed) {
                            $.ajax({
                                type: "DELETE",
                                url: "http://localhost:8081/usuario/" + id,
                                success: function (data) {
                                    Swal.fire("Eliminado!", "El usuario se eliminó correctamente", "success").then(() => {
                                        location.reload();
                                    });
                                },
                                error: function (xhr, status, error) {
                                    Swal.fire("Eror", "Ha ocurrido un error al eliminar al usuario", "error");
                                }
                            });
                        }

                    });
                });

            });
    </script>
    </div>
</html>
