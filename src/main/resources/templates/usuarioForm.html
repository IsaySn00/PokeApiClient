<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <div class="container" layout:fragment="contenido">
        <style>
            .card-registro{
                border: none;
                border-radius: 20px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                overflow: hidden;
            }

            .card-header{
                background-color: #ff3e3e;
                color: white;
                text-align: center;
                padding: 20px;
                border-bottom: none;
            }

            btn-register{
                background-color: #3b4cca;
                border: none;
                padding: 12px;
                font-weight: bold;
                font-size: 1.1rem;
                transition: background 0.3s;
            }

            btn-register:hover{
                background-color: #2a3990;
            }

            .form-floating > label{
                padding-left: 15px;
            }

            .correct{
                border-color: green;
            }

            .error{
                border-color: red;
            }
        </style>

        <script>


            function SoloLetras(event, input) {
                let value = event.key;
                //let RegExp = /^[a-zA-ZñÑ]+(\s{1}[a-zA-ZñÑ]+)*$/;
                let RegExp = /^[ a-zA-ZñÑ\-\'\u00C0-\u017F]+$/;

                if (RegExp.test(value)) {
                    $(input).removeClass("error").addClass("correct");
                    $(input).siblings(".error-msg").text("");
                } else {
                    $(input).removeClass("correct").addClass("error");
                    $(input).siblings(".error-msg").text("El campo solo permite letras");
                    event.preventDefault();
                }
            }

            function SoloNumeros(event, input) {
                let value = event.key;
                let RegExp = /^[0-9]+$/;

                if (RegExp.test(value)) {
                    $(input).removeClass("error").addClass("correct");
                    $(input).siblings(".error-msg").text("");
                } else {
                    $(input).removeClass("correct").addClass("error");
                    $(input).siblings(".error-msg").text("El campo solo permite números");
                    event.preventDefault();
                }
            }

            function ValidarUsername(event, input) {
                let value = event.key;
                let RegExp = /^[a-z0-9_]+$/i;

                if (RegExp.test(value)) {
                    $(input).removeClass("error").addClass("correct");
                    $(input).siblings(".error-msg").text("");
                } else {
                    $(input).removeClass("correct").addClass("error");
                    $(input).siblings(".error-msg").text("El campo solo permite guión bajo (_)");
                    event.preventDefault();
                }
            }

            function ValidarEmail(input) {

                let value = $("#" + input.id).val();
                let RegExp = /^(([^<>()[\]\.,;:\s@\"]+(\.[^<>()[\]\.,;:\s@\"]+)*)|(\".+\"))@(([^<>()[\]\.,;:\s@\"]+\.)+[^<>()[\]\.,;:\s@\"]{2,})$/;

                if (RegExp.test(value)) {
                    $(input).removeClass("error").addClass("correct");
                    $(input).siblings(".error-msg").text("");
                } else {
                    $(input).removeClass("correct").addClass("error");
                    $(input).siblings(".error-msg").text("La dirección de email es incorrecta");
                }
            }

            function ValidarPassword(input) {

                var value = $("#" + input.id).val();
                //let value = $(input).val() || "";
                var mensajeDescriptivo = "";

                if (!/[A-Z]/.test(value)) {
                    mensajeDescriptivo = mensajeDescriptivo + " Al menos una letra mayuscula. ";
                }
                if (!/[a-z]/.test(value)) {
                    mensajeDescriptivo = mensajeDescriptivo + " Al menos una letra minuscula. ";
                }
                if (!/[0-9]/.test(value)) {
                    mensajeDescriptivo = mensajeDescriptivo + " Al menos un número. ";
                }
                if (!/[*@!#%&()^~{}]+/.test(value)) {
                    mensajeDescriptivo = mensajeDescriptivo + " Al menos un carácter especial. ";
                }
                if (value.length < 8) {
                    mensajeDescriptivo = mensajeDescriptivo + " Mínimo 8 caracteres. ";
                }

                if (mensajeDescriptivo.length > 0) {
                    $(input).removeClass("correct").addClass("error");
                    $(input).siblings(".error-msg").text(mensajeDescriptivo);
                } else {
                    $(input).removeClass("error").addClass("correct");
                    $(input).siblings(".error-msg").text("");
                }
            }


            $(document).ready(function () {
                $('#btnRegistrarUsuario').on('click', function (e) {
                    e.preventDefault(); // Evita el envío automático si es un botón submit
                    
                    SoloLetras(event);
                    SoloNumeros(event);
                    ValidarUsername(event);
                    ValidarEmail(this);
                    ValidarPassword(this);
                    
                    // verificar si hay mensajes de error visibles
                    let errores = $('.error-msg:visible').filter(function(){
                        return $(this).text().trim() !== "";
                    }).length;

                    // 2. Lógica de validación
                    if (errores > 0) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Campos inválidos',
                            text: 'Por favor, corrige los errores.'
                        });
                    } else {
                        //realizar la petición AJAX
                        registrarUsuario();
                    }
                });
                
                function registrarUsuario(){
                    const datosFormulario = $("#formRegistro").serialize();
                    
                    $.ajax({
                        url:"http://localhost:8080/api/usuario",
                        type:"POST",
                        data:datosFormulario,
                        success: function(response){
                            Swal.fire({
                                icon: "success",
                                title:"¡Registro éxitoso!",
                                text:"El usuario ha sido registrado con éxito.",
                                confirmButtonText: "Aceptar"
                            }).then(()=> {
                                //limpiar formulario
                                $("#formRegistro")[0].reset();
                            });
                        },
                        error: function(xhr, status, error){
                            let mensajeError = "Hubo un problema con la conexión";
                            
                            if(xhr.responseJSON && xhr.responseJSON.message){
                                mensajeError = xhr.responseJSON.message;
                            }
                            Swal.fire({
                                icon:"error",
                                title: "Error en el registro",
                                text:mensajeError
                            });
                        }
                    });
                }
                
            });

        </script>

        <div class="row justify-content-center mt-3">
            <div class="col-lg-8 col-md-10">
                <div class="card card-registro">
                    <div class="card-header">
                        <h3 class="mb-0"><i class="bi bi-person-badge"></i> Registro de Usuario</h3>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <form method="post" th:object="${usuario}" th:action="@{add}" id="formRegistro">
                            <h5 class="text-muted mb-3 fs-6 text-uppercase ls-1">Datos personales</h5>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <div class="form-floating">
                                        <input type="text" th:field="*{nombreUsuario}" class="form-control soloLetras" id="nombre" placeholder="Nombre" onkeypress="SoloLetras(event, this)" required/>
                                        <label for="nombre">Nombre</label>
                                        <span class="error-msg text-danger" id="icon"></span>  
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating">
                                        <input type="text" th:field="*{apellidoPatUsuario}" class="form-control" id="apPaterno" placeholder="Ap. Paterno" onkeypress="SoloLetras(event, this)" required/>
                                        <label for="nombre">Apellido Paterno</label>
                                        <span class="error-msg text-danger" id="icon"></span>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating">
                                        <input type="text" th:field="*{apellidoMatUsuario}" class="form-control" id="apMaterno" placeholder="Ap. Materno" onkeypress="SoloLetras(event, this)" required/>
                                        <label for="nombre">Apellido Materno</label>
                                        <span class="error-msg text-danger" id="icon"></span>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" th:field="*{telefonoUsuario}" id="telefono" placeholder="Teléfono" onkeypress="SoloNumeros(event, this)" required/>
                                        <label for="telefono">Teléfono</label>
                                        <span class="error-msg text-danger" id="icon"></span>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-4">
                            <h5 class="text-muted mb-3 fs-6 text-uppercase">Datos de Cuenta</h5>

                            <div class="row g-3 mb-3">
                                <div class="col-md-12">
                                    <div class="input-group">
                                        <div class="form-floating flex-grow-1">
                                            <input type="text" th:field="*{userName}" class="form-control" id="username" placeholder="Usuario" onkeypress="ValidarUsername(event, this)" required>
                                            <label for="username">Nombre de Usuario</label>
                                            <span class="error-msg text-danger" id="icon"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="email" th:field="*{emailUsuario}" class="form-control" id="email" placeholder="correo@ejemplo.com" onblur="ValidarEmail(this)" required>
                                        <label for="email">Correo Electrónico</label>
                                        <span class="error-msg text-danger" id="icon"></span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" th:field="*{passwordUsuario}" class="form-control" id="password" placeholder="Contraseña" onblur="ValidarPassword(this)" required>
                                        <label for="email">Contraseña</label>
                                        <span class="error-msg text-danger" id="icon"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grip gap-2">
                                <button type="submit" class="btn btn-primary btn-register btn-lg text-white rounded-pill shadow-sm" id="btnRegistrarUsuario">
                                    Registrarse
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
