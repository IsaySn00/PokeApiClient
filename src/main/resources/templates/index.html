<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <div class="container py-5" layout:fragment="contenido">
        
        <style>
            .pokemon-card{
                border:none;
                border-radius: 15px;
                background: white;
                transition: all 0.3 ease;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
                overflow: hidden;
                cursor: pointer;
            }

            .pokemon-card:hover{
                transform: translateY(-5px);
                box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            }

            .card-img-container{
                background-color: #f0f0f0;
                padding: 20px;
                text-align: center;
                border-bottom: 1px solid #e0e0e0;
            }

            .pokemon-img{
                width: 120px;
                height: 120px;
                object-fit: contain;
                filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            }

            .card-body{
                text-align: center;
            }

            .pokemon-id{
                color: #999;
                font-size: 0.9rem;
                font-weight: 600;
            }

            .pokemon-name{
                font-weight: bold;
                font-size: 1.2rem;
                color: #333;
                text-transform: capitalize;
                margin-bottom: 5px;
            }

            .navbar-center {
                position: absolute;
                left: 50%;
                transform: translatex(-50%);
            }
        </style>

        <div class="row mb-4">
            <div class="col-12 text-center">
                <h2 class="fw-bold text-secondary">Selecciona tu Pokémon</h2>
                <p class="text-muted">Explora la lista de Pokémon descubiertos</p>
            </div>
        </div>

        <nav class="navbar navbar-light bg-light w-50 navbar-center">
            <div class="container-fluid">
                <form class="d-flex w-100" th:action="@{pokemon/realizar-busqueda}" method="GET">
                    <input class="form-control me-2" type="search" placeholder="Busca un pokemon por su nombre..." aria-label="Search" name="name">
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </nav>

        <br><br><br>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            <div th:each="pokemon : ${pokemons}" class="col">
                <div class="card pokemon-card h-100">
                    <a th:href="@{/pokemon/detail/{id}(id = ${pokemon.id})}">
                        <div class="card-img-container">
                            <img class="pokemon-img" th:src="${pokemon.imageUrl}"  alt="imagen de pokémon"/>
                        </div>
                        <div class="card-body">
                            <p class="pokemon-id"></p>
                            <h5 class="pokemon-name" th:text="${pokemon.name}"></h5>
                            <!--                        <div class="mt-2">
                                                        <span class="badge badge-type bg-grass text-white"></span>
                                                    </div>-->
                        </div>
                    </a>    
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col text-center">
                <a th:if="${hasPrevious}" th:href="@{/pokemon(page=${currentPage - 1})}" class="btn btn-outline-secondary me-2">
                    Anterior
                </a>

                <span th:each="pageNum : ${#numbers.sequence(startPage, endPage)}">
                    <a 
                        th:href="@{/pokemon(page=${pageNum})}" 
                        th:text="${pageNum}"
                        th:classappend="${pageNum == currentPage} ? 'btn-primary' : 'btn-outline-secondary'"
                        class="btn mx-1"
                        ></a>
                </span>

                <a th:if="${hasNext}" th:href="@{/pokemon(page=${currentPage + 1})}" class="btn btn-outline-secondary me-2">
                    Siguiente
                </a>  
            </div>
        </div>
        <script th:inline="javascript">
//            $(document).ready(function () {
//                                
//                if(sessionStorage.getItem("tokenUser") == null){
//                    sessionStorage.setItem("tokenUser", /*[[${session.tkn}]]*/ '')
//                }
//                
//            })
        </script>
    </div>
</html>
